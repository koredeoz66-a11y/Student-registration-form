<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>
</head>
<body>

  <header>
    <h1>Student Registration Form</h1>
    <p>Complete all required fields to register.</p>
  </header>

  <main>
    <form action="/register" method="post">

      <fieldset>
        <legend>Personal Information</legend>

        <p>
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" required
                 autocomplete="name" placeholder="Enter your full name">
        </p>

        <p>
          <label for="matric-no">Matriculation Number</label>
          <input type="text" id="matric-no" name="matric_no" required
                 placeholder="e.g. CSC/2024/1234">
        </p>

        <p>
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required
                 autocomplete="email" placeholder="you@example.com">
        </p>

        <p>
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" required
                 autocomplete="tel" placeholder="e.g. 08012345678">
        </p>

        <fieldset>
          <legend>Gender</legend>

          <p>
            <input type="radio" id="male" name="gender" value="Male" required>
            <label for="male">Male</label>
          </p>

          <p>
            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>
          </p>

          <p>
            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label>
          </p>
        </fieldset>
      </fieldset>

      <fieldset>
        <legend>Academic Information</legend>

        <p>
          <label for="department">Department</label>
          <select id="department" name="department" required>
            <option value="" disabled selected>Select your department</option>
            <option value="computer-science">Computer Science</option>
            <option value="information-technology">Information Technology</option>
            <option value="information-communication-technology">Information Communication Technology</option>
            <option value="data-science">Data Science</option>
            <option value="cyber-security">Cyber Security</option>
            <option value="software-engineering">Software Engineering</option>
            <option value="information-system">Information System</option>
          </select>
        </p>

        <p>
          <label for="programme">Programme</label>
          <select id="programme" name="programme" required>
            <option value="" disabled selected>Select your programme</option>
            <option value="fulltime">Full-time</option>
            <option value="weekdays">Weekdays</option>
            <option value="weekend">Weekend</option>
          </select>
        </p>
      </fieldset>

      <p>
        <button type="submit">Submit Registration</button>
      </p>

    </form>
  </main>

  <footer>
    <p>&copy; 2026 Student Registration Portal</p>
  </footer>

</body>
</html>
